[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fabric-field-operations-platform"
version = "0.1.0"
description = "Enterprise Microsoft Fabric Field Operations Intelligence Platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Devon Johnson" }
]

dependencies = [
    "requests>=2.32.0",
    "PyYAML>=6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0,<10.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]